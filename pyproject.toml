[project]
name = "pytaut"
version = "0.4.0"
description = "Deterministic architecture policy checks for Python backends"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "TaeWoo Kim", email = "173425210+taewoo-dev@users.noreply.github.com" },
]
keywords = ["architecture", "linter", "policy", "python", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "msgspec>=0.19",
]

[project.urls]
Documentation = "https://github.com/taewoo-dev/taut#readme"
Issues = "https://github.com/taewoo-dev/taut/issues"
Repository = "https://github.com/taewoo-dev/taut"

[project.scripts]
taut = "taut.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=6",
  "pyright>=1.1.405",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taut"]

[tool.hatch.build.targets.sdist]
exclude = [
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-q", "--tb=short", "--strict-markers", "-ra"]
markers = [
  "integration: checks multiple engine stages or the installed CLI",
  "contract: checks a stable architecture or result contract",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["taut"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
files = ["src", "tests", "scripts"]
exclude = ["^tests/fixtures/"]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["."]
exclude = ["tests/fixtures"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.taut]
schema_version = 4
packs = ["taut.backend"]
providers = ["taut.python-core"]
strict = true
include = ["src/*.py", "src/**/*.py"]
source_roots = ["src"]

[tool.taut.roles]
domain = ["src/taut/domain/*.py", "src/taut/domain/**/*.py"]
analysis = ["src/taut/analysis/*.py", "src/taut/analysis/**/*.py"]
configuration = [
  "src/taut/configuration/*.py",
  "src/taut/configuration/**/*.py",
]
policy = ["src/taut/policy/*.py", "src/taut/policy/**/*.py"]
finding_processing = [
  "src/taut/finding_processing/*.py",
  "src/taut/finding_processing/**/*.py",
]
incremental = ["src/taut/incremental/*.py", "src/taut/incremental/**/*.py"]
cache = ["src/taut/cache/*.py", "src/taut/cache/**/*.py"]
loading = ["src/taut/loading/*.py", "src/taut/loading/**/*.py"]
reporting = ["src/taut/reporting/*.py", "src/taut/reporting/**/*.py"]
composition = [
  "src/taut/__init__.py",
  "src/taut/check_runtime.py",
  "src/taut/check_service.py",
  "src/taut/assurance.py",
  "src/taut/cli.py",
  "src/taut/cli_assurance.py",
  "src/taut/onboarding.py",
  "src/taut/onboarding_detection.py",
  "src/taut/onboarding_policy.py",
  "src/taut/onboarding_questions.py",
  "src/taut/onboarding_roles.py",
  "src/taut/onboarding_scope.py",
  "src/taut/daemon_*.py",
  "src/taut/plugins/*.py",
  "src/taut/semantic/*.py",
]
bootstrap = { include = ["src/taut/daemon_state.py"], priority = 10 }

[tool.taut.allow]
domain = ["domain"]
analysis = ["domain", "analysis"]
configuration = ["domain", "configuration"]
policy = ["domain", "analysis", "configuration", "policy"]
finding_processing = ["domain", "configuration", "finding_processing"]
incremental = ["domain", "analysis", "policy", "incremental"]
cache = ["domain", "analysis", "cache"]
loading = ["domain", "analysis", "configuration", "loading"]
reporting = ["domain", "reporting"]
composition = [
  "domain",
  "analysis",
  "configuration",
  "policy",
  "finding_processing",
  "incremental",
  "loading",
  "reporting",
  "cache",
  "composition",
  "bootstrap",
]
bootstrap = [
  "domain",
  "analysis",
  "configuration",
  "policy",
  "finding_processing",
  "incremental",
  "loading",
  "reporting",
  "cache",
  "composition",
  "bootstrap",
]

[tool.taut.layers]
service = ["policy"]
contract = ["domain"]

[tool.taut.external]
logged_calls = ["httpx.AsyncClient", "httpx.Client"]
wrappers = ["taut.external_call"]

[tool.taut.enum]
shared_modules = [
  "taut.configuration.assurance",
  "taut.configuration.catalog",
  "taut.domain.diagnostics",
  "taut.domain.evaluations",
  "taut.domain.facts",
  "taut.domain.analysis_state",
  "taut.domain.findings",
  "taut.domain.issues",
  "taut.domain.relations",
]
uppercase_value_exceptions = ["taut.configuration.catalog.Effect"]

[tool.taut.assurance]
max_approvals = 0
max_inline_ignores = 0

[tool.taut.assurance.features]
api = "absent"
schema = "absent"
dto = "absent"
snapshot = "absent"
exception_registry = "absent"
enum = "required"
database = "absent"
transaction = "absent"
external_calls = "absent"
security = "required"
tests = "absent"
migrations = "absent"
scripts = "absent"

[[tool.taut.exclusions]]
patterns = ["tests/*.py"]
reason = "Rule fixtures intentionally contain violations; pytest validates them separately."

[[tool.taut.exclusions]]
patterns = ["scripts/*.py"]
reason = "Release tooling is validated by Ruff, mypy, Pyright, and dedicated smoke tests."

[[tool.taut.assurance.assertions]]
domain = "dto"
kind = "path"
target = "src/taut/analysis/contracts.py"
state = "not_applicable"
reason = "Analyzer result records are engine contracts, not application layer DTOs."

[[tool.taut.assurance.assertions]]
domain = "dto"
kind = "path"
target = "src/taut/analysis/module_cache.py"
state = "not_applicable"
reason = "Cache result records are internal engine contracts, not application layer DTOs."

[[tool.taut.assurance.assertions]]
domain = "dto"
kind = "path"
target = "src/taut/check_service.py"
state = "not_applicable"
reason = "Check results are public engine reports, not application layer DTOs."

[[tool.taut.assurance.assertions]]
domain = "dto"
kind = "path"
target = "src/taut/finding_processing/finding_processor.py"
state = "not_applicable"
reason = "Finding results are internal processing contracts, not application layer DTOs."

[[tool.taut.assurance.assertions]]
domain = "dto"
kind = "path"
target = "src/taut/loading/inline_ignores.py"
state = "not_applicable"
reason = "Loader results are internal parsing contracts, not application layer DTOs."

[[tool.taut.assurance.assertions]]
domain = "dto"
kind = "path"
target = "src/taut/loading/source_discovery.py"
state = "not_applicable"
reason = "Discovery results are internal engine contracts, not application layer DTOs."

[[tool.taut.assurance.assertions]]
domain = "dto"
kind = "path"
target = "src/taut/policy/engine.py"
state = "not_applicable"
reason = "Policy results are internal evaluation contracts, not application layer DTOs."

[[tool.taut.assurance.assertions]]
domain = "exception_registry"
kind = "symbol"
target = "taut.cache.store.CacheMiss"
state = "not_applicable"
reason = "Internal cache control flow is not an application exception registry."

[[tool.taut.assurance.assertions]]
domain = "exception_registry"
kind = "symbol"
target = "taut.daemon_client.DaemonError"
state = "not_applicable"
reason = "The CLI transport error is not an application exception registry."

[[tool.taut.assurance.assertions]]
domain = "exception_registry"
kind = "symbol"
target = "taut.loading.errors.PolicyConfigError"
state = "not_applicable"
reason = "The configuration parser error is not an application exception registry."
